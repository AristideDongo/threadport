name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:extension
      - name: Test
        run: npm run ${{ runner.os == 'Linux' && 'test:coverage' || 'test' }}
      - run: npm run build
      - run: npm run build --workspace threadport-vscode
      - name: Package VS Code extension
        if: runner.os == 'Linux'
        run: npm run package --workspace threadport-vscode
      - name: Check package contents
        run: |
          npm pack --dry-run --ignore-scripts --json --silent > threadport-pack.json
          node -e 'const fs = require("node:fs"); const files = JSON.parse(fs.readFileSync("threadport-pack.json", "utf8"))[0].files.map(file => file.path); if (files.includes("THREADPORT_PROJECT_PROMPT.md") || !files.includes("dist/interfaces/cli/main.js")) process.exit(1)'
  verify:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
