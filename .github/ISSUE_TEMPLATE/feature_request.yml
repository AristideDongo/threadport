name: Feature request
description: Suggest an improvement to ThreadPort
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how you would expect ThreadPort to work.
    validations:
      required: true
